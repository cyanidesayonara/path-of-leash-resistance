        run: bash tools/godot_ci.sh ./Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tests/test_mood.gd

      - name: Human appearance regression test
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a --server-args="-screen 0 1280x1024x24" bash tools/godot_ci.sh ./Godot_v4.7-stable_linux.x86_64 --rendering-method gl_compatibility --path . --script res://tests/test_human_appearance.gd

      - name: NPC pair owner appearance regression test
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a --server-args="-screen 0 1280x1024x24" bash tools/godot_ci.sh ./Godot_v4.7-stable_linux.x86_64 --rendering-method gl_compatibility --path . --script res://tests/test_pair_owner_appearance.gd

      # reshapes a real viewport to a landscape phone and a portrait phone and
      # asserts the HUD follows. Needs a rendering context: anchors only resolve
      # against a live viewport, which is exactly what the headless run lacks.
      - name: HUD anchoring across window shapes
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a --server-args="-screen 0 1280x1024x24" bash tools/godot_ci.sh ./Godot_v4.7-stable_linux.x86_64 --rendering-method gl_compatibility --path . --script res://tests/test_hud_anchoring.gd

      # touch buttons change with the walk state and reshape against the live
      # viewport, so this needs the same rendering context as HUD anchoring
      - name: Touch controls across states and window shapes
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a --server-args="-screen 0 1280x1024x24" bash tools/godot_ci.sh ./Godot_v4.7-stable_linux.x86_64 --rendering-method gl_compatibility --path . --script res://tests/test_touch_controls.gd

      # a portrait window gets the "turn your phone" prompt and a paused walk
      # (#5); reshapes a real viewport, so it needs a rendering context too
      - name: Rotate prompt in portrait windows
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a --server-args="-screen 0 1280x1024x24" bash tools/godot_ci.sh ./Godot_v4.7-stable_linux.x86_64 --rendering-method gl_compatibility --path . --script res://tests/test_rotate_prompt.gd

      # ShapeBatch merges circles into one draw call and must match
      # draw_circle pixel for pixel; renders offscreen, so it needs GL
      - name: Shape batch matches draw_circle
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a --server-args="-screen 0 1280x1024x24" bash tools/godot_ci.sh ./Godot_v4.7-stable_linux.x86_64 --rendering-method gl_compatibility --path . --script res://tests/test_shape_batch.gd

      - name: Level structural sanity sweep (every walk)
        # validates each level inside the real runtime: props on their own
        # pavement, well-formed goal lists, and goals the level can actually
        # satisfy. Catches content mistakes a pure-logic test cannot see.
        run: |
          for LV in barri street park beach rain market oldtown trail station site spook scrap guell neteja montjuic tutorial; do
            ./Godot_v4.7-stable_linux.x86_64 --headless --path . -- --level=$LV --selftest 2>&1 | tee sane-$LV.log
            grep -q "SELFTEST OK" sane-$LV.log
            ! grep -q "SELFTEST FAIL" sane-$LV.log
            ! grep -qE "SCRIPT ERROR|Parse Error" sane-$LV.log
          done

      - name: Headless smoke tests (all levels)
        # Runs each level for 1800 simulated frames (~30s): catches parse
        # errors and runtime script errors in the main gameplay loop.
        run: |
          for LV in barri street park beach rain market oldtown trail station site spook scrap guell neteja montjuic tutorial; do
            ./Godot_v4.7-stable_linux.x86_64 --headless --path . --quit-after 1800 -- --level=$LV 2>&1 | tee smoke-$LV.log
            ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script" smoke-$LV.log
          done
          # the tutorial walk: a separate calm level build
          ./Godot_v4.7-stable_linux.x86_64 --headless --path . --quit-after 1200 -- --tutorial 2>&1 | tee smoke-tutorial.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script" smoke-tutorial.log
          # snow weather: exercises the ice-slide physics path
          ./Godot_v4.7-stable_linux.x86_64 --headless --path . --quit-after 1800 -- --level=street --weather=snow 2>&1 | tee smoke-snow.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script" smoke-snow.log

      - name: Full-walk traversal (out -> freedom -> home -> finish)
        # the attract bot walks street end to end; asserts the whole
        # three-leg structure completes without error. --fixed-fps makes
        # frame count map to physics time deterministically.
        run: |
          ./Godot_v4.7-stable_linux.x86_64 --headless --fixed-fps 60 --path . --quit-after 12000 -- --level=street --autowalk 2>&1 | tee walk.log
          ! grep -E "SCRIPT ERROR|Parse Error" walk.log
          grep -q "AUTOWALK FINISHED" walk.log
          ! grep -q "AUTOWALK STALL" walk.log

      - name: Full-walk traversal with the sweeper chase (--chase)
        # forces the home-leg chase on; asserts the bot still completes the
        # whole loop with the devourer active and no errors.
        run: |
          ./Godot_v4.7-stable_linux.x86_64 --headless --fixed-fps 60 --path . --quit-after 12000 -- --level=street --autowalk --chase 2>&1 | tee chase.log
          ! grep -E "SCRIPT ERROR|Parse Error" chase.log
          grep -q "AUTOWALK FINISHED" chase.log
          ! grep -q "AUTOWALK STALL" chase.log

      - name: Full-walk traversal with the bolt chase (--bolt)
        # the fast, owner-panics chase variant: asserts the loop still
        # completes with the human sprinting and the dog in tow.
        run: |
          ./Godot_v4.7-stable_linux.x86_64 --headless --fixed-fps 60 --path . --quit-after 12000 -- --level=street --autowalk --bolt 2>&1 | tee bolt.log
          ! grep -E "SCRIPT ERROR|Parse Error" bolt.log
          grep -q "AUTOWALK FINISHED" bolt.log
          ! grep -q "AUTOWALK STALL" bolt.log

      - name: Full-walk traversal with the rescue chase (--rescue)
        # the "both flee" emergency variant: owner panics AND the fast
        # threat; asserts the loop still completes.
        run: |
          ./Godot_v4.7-stable_linux.x86_64 --headless --fixed-fps 60 --path . --quit-after 12000 -- --level=street --autowalk --rescue 2>&1 | tee rescue.log
          ! grep -E "SCRIPT ERROR|Parse Error" rescue.log
          grep -q "AUTOWALK FINISHED" rescue.log
          ! grep -q "AUTOWALK STALL" rescue.log
