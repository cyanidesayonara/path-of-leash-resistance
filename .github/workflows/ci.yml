name: CI

on:
  push:
    branches: [main]
    # Version tags must run the full suite so release.yml can gate publish
    # on a green CI result for the exact tagged SHA.
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    # a green run takes 8 to 9.5 minutes; at 10, half of them were cancelled
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Download Godot
        run: |
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7-stable_linux.x86_64

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils

      # the icon is the project's one imported resource; without a cache the
      # windowed runs below complain about a missing dependency
      - name: Import resources
        run: ./Godot_v4.7-stable_linux.x86_64 --headless --path . --import

      # every script's .uid is committed next to it; an import that creates a
      # file git does not know about means one was forgotten (#16)
      - name: Import leaves the checkout clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Import created or changed files - commit them:"
            git status --porcelain
            exit 1
          fi

      - name: Leash winding regression test
        run: bash tools/godot_ci.sh ./Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tests/test_wrap.gd

      - name: Leash repeated setup regression test
        run: bash tools/godot_ci.sh ./Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tests/test_leash_setup.gd

      - name: Leash pull tangent regression test
        run: bash tools/godot_ci.sh ./Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tests/test_leash_weighted_tangent.gd

      - name: Leash visible path regression test
        run: bash tools/godot_ci.sh ./Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tests/test_leash_render_path.gd

      - name: Leash draw buffer regression test
        run: bash tools/godot_ci.sh ./Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tests/test_leash_draw_buffers.gd

      - name: Leash taut onset regression test
        run: bash tools/godot_ci.sh ./Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tests/test_leash_taut_transition.gd

      - name: Leash taut settling regression test
        run: bash tools/godot_ci.sh ./Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tests/test_leash_taut_settling.gd

