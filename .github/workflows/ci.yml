name: CI

on:
  push:
    branches: [main]
    # Version tags must run the full suite so release.yml can gate publish
    # on a green CI result for the exact tagged SHA.
    tags: ["v*"]
  pull_request:
    branches: [main]

# A newer push to a pull request makes its running CI moot. Every push to main
# or a version tag is a group of its own, so it always runs to the end:
# release.yml waits for the tagged SHA's run to succeed.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Commits carry Santtu Nykänen's name only. A local commit-msg hook does not
  # travel with a clone or a cloud agent, so the whole history is checked here,
  # and release.yml will not publish a tag whose CI run fails this.
  attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: No co-author or tool attribution in any commit
        run: |
          found="$(git log --format='%H%n%B' HEAD | grep -niE '^(co-authored-by|generated-by|assisted-by|made-with):|cursoragent@|noreply@anthropic' || true)"
          if [ -n "$found" ]; then
            echo "Attribution trailers are not allowed in this repo:"
            git log --format='%h %s' -i -E --grep='^(co-authored-by|generated-by|assisted-by|made-with):|cursoragent@|noreply@anthropic' HEAD
            exit 1
          fi

  # Every test in tests/ci_tests.txt and every walk check (each walk built,
  # sanity-checked and played, the tutorial and snow smokes, four full
  # autowalks), split by cost into shards that run side by side. One runner
  # took ~37 minutes for the lot; a shard takes about six. tools/run_tests.sh
  # does the splitting and runs the same list locally.
  shard:
    name: shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - uses: actions/checkout@v5

      # the text the Store submit workflow sends must fit the Store's limits
      - name: Store listing check
        if: matrix.shard == 1
        run: python3 tools/store_listing.py --check store/listing.md

      # A GitHub release download can fail for minutes at a time (504s on
      # 2026-11-08 failed every job): keep the zip in the Actions cache and
      # retry the download when it is not there.
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: godot.zip
          key: godot-4.7-stable-linux-x86_64

      - name: Download Godot
        run: |
          if [ ! -s godot.zip ]; then
            curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors -o godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          fi
          unzip -q godot.zip
          chmod +x Godot_v4.7-stable_linux.x86_64

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils

      # the icon is the project's one imported resource; without a cache the
      # windowed runs below complain about a missing dependency
      - name: Import resources
        run: ./Godot_v4.7-stable_linux.x86_64 --headless --path . --import

      # every script's .uid is committed next to it; an import that creates a
      # file git does not know about means one was forgotten (#16)
      - name: Import leaves the checkout clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Import created or changed files - commit them:"
            git status --porcelain
            exit 1
          fi

      # each test's output is a collapsed group in the log; a failure prints
      # its whole output ungrouped, under an error line naming it
      - name: Tests and walk checks (shard ${{ matrix.shard }} of 8)
        env:
          SHARD: ${{ matrix.shard }}/8
          WALKS: "1"
          XVFB: "1"
          TIMEOUT: "600"
        run: bash tools/run_tests.sh

  # The one check to look for on a pull request: it passes only when every
  # shard did. Keeps the name the single job had.
  smoke:
    if: always()
    needs: [shard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        run: |
          if [ "${{ needs.shard.result }}" != "success" ]; then
            echo "A shard did not pass (${{ needs.shard.result }}); see the shard jobs."
            exit 1
          fi
