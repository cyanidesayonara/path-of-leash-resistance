# Prove the release secrets still work, publishing nothing: one job per
# environment that release.yml uses (docs/release-secrets.md). The Store's
# own check is store-submit.yml with mode configure.
# - itch: butler logs in with BUTLER_API_KEY and lists the game's channels.
# - google-play: the upload keystore opens with its alias and password, and
#   the Play service account (when set) gets a token, opens an edit of the app
#   and deletes it unsaved, as fastlane's key check does.
# Run it from main (Actions > Check release credentials > Run workflow); the
# environments deploy from main and v* tags only, and from any other branch
# both jobs skip.

name: Check release credentials (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  itch:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: itch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: List the game's itch channels with butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BUTLER_API_KEY}" ]; then
            echo "BUTLER_API_KEY is not set in the itch environment."
            exit 1
          fi
          curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          ./butler -V
          ./butler status cyanidesayonara/path-of-leash-resistance

  google-play:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: google-play
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # certreq signs with the private key, so it needs the key's password
      # too; the request itself goes to /dev/null
      - name: Open the upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "$v is not set in the google-play environment."
              exit 1
            fi
          done
          ks="$RUNNER_TEMP/upload.keystore"
          trap 'rm -f "$ks"' EXIT
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ks"
          keytool -list -keystore "$ks" -storepass:env ANDROID_KEY_PASSWORD -alias "$ANDROID_KEY_ALIAS"
          keytool -certreq -keystore "$ks" -storepass:env ANDROID_KEY_PASSWORD \
            -alias "$ANDROID_KEY_ALIAS" -keypass:env ANDROID_KEY_PASSWORD -file /dev/null
          echo "The keystore opens and the key signs."

      - name: Open and discard a Play edit
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}" ]; then
            echo "::notice::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not set; release.yml skips the Play upload too."
            exit 0
          fi
          python3 tools/play_credentials.py com.santtunykanen.pathofleashresistance
