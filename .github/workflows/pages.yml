name: Website

# Publishes the website to GitHub Pages: site/ at the root and the latest
# released web build at /play. One workflow builds the whole site every time,
# so a site edit and a release can never wipe each other's part (a Pages
# deploy replaces the entire site).
#
# The copy is filled in at deploy time (tools/site_copy.py: the Store
# description, What's new and features from store/listing.md, the walk count
# and names from autoload/game.gd), and the fonts are the game's own files, so
# the published site always says and looks what the game does. A release also
# regenerates every screenshot and clip from the game (tools/site_media.sh).
# The colours are site/palette.css, generated from hud/ui_kit.gd and held to it
# by tests/test_site_palette.gd.
#
# Triggers:
#   - a push to main that touches site/, the listing, the walk list, the
#     palette, the fonts or this file: rebuilds with the web build from the
#     latest GitHub release and the committed images
#   - a finished release.yml run for a tag: rebuilds with that tag's web zip
#     (the one release.yml attaches); if the zip is missing, the latest
#     release that has one is used, so the site never loses /play. The
#     screenshots, clips and copy come from the tagged commit; if rendering
#     fails the committed images are published instead
#   - manual dispatch
# workflow_run always runs on the default branch, which keeps the deploy
# inside the github-pages environment's default-branch rule.
#
# One-time setup (docs/website.md): Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "store/listing.md"
      - "autoload/game.gd"
      - "hud/ui_kit.gd"
      - "fonts/**"
      - "tools/site_copy.py"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Release to itch.io"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time, and never cancel one halfway
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # a release run started by a tag push; manual release runs from a branch
    # publish nothing new to the site
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # A release: the screenshots, clips and copy come from the released
      # commit (head_sha), checked out beside main in rel/, while the pages,
      # styles and fonts deployed stay main's. Rendering is not fatal, so a
      # hiccup never holds back /play; the committed images go out instead.
      - name: Check out the released commit
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: rel

      - name: Cache Godot
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/cache@v4
        with:
          path: godot.zip
          key: godot-4.7-stable-linux-x86_64

      - name: Render screenshots and clips from the released commit
        if: ${{ github.event_name == 'workflow_run' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ ! -s godot.zip ]; then
            curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors -o godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          fi
          unzip -q -o godot.zip -d rel
          chmod +x rel/Godot_v4.7-stable_linux.x86_64
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils fonts-dejavu-core python3-pil
          cd rel
          ./Godot_v4.7-stable_linux.x86_64 --headless --path . --import
          bash tools/site_media.sh
          cd ..
          cp rel/site/img/* site/img/

      # main's pages, filled from the release's listing and walk list on a
      # release, from main's otherwise
      - name: Fill in the copy
        env:
          FROM: ${{ github.event_name == 'workflow_run' && '--from=rel' || '' }}
        run: python3 tools/site_copy.py ${FROM}

      - name: Assemble the site
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || '' }}
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/play
          cp -r site/. _site/
          rm -f _site/.gdignore
          # the game's two faces and their licences
          mkdir -p _site/fonts
          cp fonts/*.ttf fonts/OFL-*.txt _site/fonts/

          zip=leash-resistance-web.zip
          got=""
          if [ -n "${TAG}" ] && gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "${zip}" --dir dl 2>/dev/null; then
            got="${TAG}"
          else
            # newest release first; the first one with a web zip wins
            for t in $(gh release list --repo "${GITHUB_REPOSITORY}" --limit 20 --json tagName --jq '.[].tagName'); do
              if gh release download "${t}" --repo "${GITHUB_REPOSITORY}" --pattern "${zip}" --dir dl 2>/dev/null; then
                got="${t}"
                break
              fi
            done
          fi
          if [ -z "${got}" ]; then
            echo "No release has ${zip}; refusing to publish a site without /play."
            exit 1
          fi
          echo "Web build from ${got}"
          unzip -q "dl/${zip}" -d _site/play
          # Godot's import sidecars are not needed to serve the build
          rm -f _site/play/*.import
          test -f _site/play/index.html
          test -f _site/play/index.wasm

          # GitHub Pages refuses any file over 100 MB
          big="$(find _site -type f -size +95M)"
          if [ -n "${big}" ]; then
            echo "Too close to the 100 MB Pages file limit:"
            ls -la ${big}
            exit 1
          fi
          ls -la _site/play
          du -sh _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
