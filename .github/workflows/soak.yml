name: Idle soak

# Every walk with no input for 30s of game time, at 1280x720, 1920x1080 and
# 844x390, three seeds each (tools/idle_soak.sh). Counts knocks on the idle
# dog, mood arrivals and phone cracks, and fails a run over the thresholds in
# the script. One job per walk so the matrix finishes in minutes.
#
# Separate from ci.yml while the thresholds are provisional: it does not gate
# the release. Move it into ci.yml once the thresholds have held for a while.
#
# By hand only, and only on the walks named: on every push to main it ran 26
# jobs and some eight runner-hours for numbers that gate nothing, most of what
# this repository asked of GitHub in November 2026 (docs/ci-budget.md). Run
# tools/idle_soak.sh on your own machine first.

on:
  workflow_dispatch:
    inputs:
      levels:
        description: "The walks to soak, as a JSON list"
        type: string
        default: '["street", "park", "raval"]'

permissions:
  contents: read

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soak:
    runs-on: ubuntu-latest
    # nine runs take 12-25 minutes depending on the runner; room on top for
    # one run to hang to its own limit in idle_soak.sh and still be reported
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        level: ${{ fromJSON(inputs.levels) }}

    steps:
      - uses: actions/checkout@v5

      # A GitHub release download can fail for minutes at a time (504s on
      # 2026-11-08 failed every job): keep the zip in the Actions cache and
      # retry the download when it is not there.
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: godot.zip
          key: godot-4.7-stable-linux-x86_64

      - name: Download Godot
        run: |
          if [ ! -s godot.zip ]; then
            curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors -o godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          fi
          unzip -q godot.zip
          chmod +x Godot_v4.7-stable_linux.x86_64

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils

      - name: Import resources
        run: ./Godot_v4.7-stable_linux.x86_64 --headless --path . --import

      - name: Soak
        env:
          LEVELS: ${{ matrix.level }}
        run: bash tools/idle_soak.sh soak

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-${{ matrix.level }}
          path: soak/
          retention-days: 14
