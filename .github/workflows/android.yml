# Build the Android App Bundle and APK the way release.yml does on a tag,
# but signed with a throwaway key made for this run: no secrets, nothing
# published. It proves the Android export still builds before a tag needs it,
# and its APK artifact installs on a phone or tablet by hand (uninstall it
# before installing a Play build: the keys differ).
# Runs on pull requests that touch the Android export, and by hand.

name: Android build

on:
  pull_request:
    paths:
      - export_presets.cfg
      - project.godot
      - tools/android_export.sh
      - .github/workflows/android.yml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Godot and its export templates
        uses: actions/cache@v4
        with:
          path: |
            godot.zip
            templates.tpz
          key: godot-4.7-stable-linux-templates

      - name: Download Godot + export templates
        run: |
          set -euo pipefail
          if [ ! -s godot.zip ]; then
            curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors -o godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          fi
          if [ ! -s templates.tpz ]; then
            curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          fi
          unzip -q -o godot.zip
          chmod +x Godot_v4.7-stable_linux.x86_64
          unzip -q -o templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.stable
          mv templates/* ~/.local/share/godot/export_templates/4.7.stable/

      - name: Import, bake music, stamp version
        run: |
          set -euo pipefail
          ./Godot_v4.7-stable_linux.x86_64 --headless --path . --import
          ./Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tools/bake_music.gd
          bash tools/stamp_version.sh

      - name: Export with a throwaway key
        run: |
          set -euo pipefail
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/throwaway.keystore"
          export ANDROID_KEY_ALIAS=throwaway
          ANDROID_KEY_PASSWORD="$(openssl rand -hex 16)"
          export ANDROID_KEY_PASSWORD
          keytool -genkeypair -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 30 -dname "CN=throwaway" \
            -storepass:env ANDROID_KEY_PASSWORD -keypass:env ANDROID_KEY_PASSWORD
          GODOT="$PWD/Godot_v4.7-stable_linux.x86_64" TAG=v0.1 bash tools/android_export.sh
          # the preset is put back as it was
          git diff --exit-code export_presets.cfg

      - name: Keep the APK to install by hand
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/android/PathOfLeashResistance.apk
          retention-days: 7
