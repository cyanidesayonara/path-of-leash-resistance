name: Release to itch.io

# Production publish path: push a version tag (v*). Release waits for a
# successful CI run on that exact commit SHA, then exports and publishes.
#
# Manual dispatch exists as an escape hatch, and it is gated the same way by
# default: dispatch on a tag and it still waits for green CI on that SHA. The
# gate is only skipped if the operator explicitly ticks skip_ci_gate, which is
# for when the GATE itself is broken - otherwise a flaky CI run on an
# already-pushed tag would leave no way to publish but deleting the tag.
#
# One-time setup needed:
#   1. Get an API key from https://itch.io/user/settings/api-keys
#   2. Add it to the repo as a secret named BUTLER_API_KEY
#      (Settings > Secrets and variables > Actions > New repository secret)
# After that: `git tag v1.53 && git push --tags` publishes (once CI is green
# for the tagged SHA).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      skip_ci_gate:
        description: "Publish without waiting for green CI (only if the gate itself is broken)"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # the default token is read-only, so creating a GitHub release 403s
    # without contents:write; actions:read is required to query CI runs
    permissions:
      contents: write
      actions: read
    steps:
      - name: Require green CI for this exact SHA
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_ci_gate }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          echo "Requiring a successful CI workflow run for commit ${SHA}"
          # Tag push starts CI in parallel; poll until that SHA is green.
          # A prior successful CI run on the same SHA (e.g. main push) also
          # satisfies the gate - we only care about the exact commit.
          deadline=$((SECONDS + 1200))
          while (( SECONDS < deadline )); do
            json="$(gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --commit "${SHA}" \
              --workflow ci.yml \
              --limit 30 \
              --json databaseId,conclusion,status,event,url,displayTitle,headSha)"
            echo "${json}" | jq -c '.[] | {databaseId,status,conclusion,event,url}' || true

            success="$(echo "${json}" | jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length')"
            if [ "${success}" -gt 0 ]; then
              echo "CI succeeded for ${SHA}; proceeding with release."
              echo "${json}" | jq '[.[] | select(.status == "completed" and .conclusion == "success")][0]'
              exit 0
            fi

            pending="$(echo "${json}" | jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting" or .status == "requested")] | length')"
            failed="$(echo "${json}" | jq '[.[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "startup_failure")] | length')"

            if [ "${pending}" -eq 0 ] && [ "${failed}" -gt 0 ]; then
              echo "CI did not succeed for ${SHA}; refusing to publish."
              exit 1
            fi

            if [ "$(echo "${json}" | jq 'length')" -eq 0 ]; then
              echo "No CI runs listed yet for ${SHA}; waiting..."
            else
              echo "CI not green yet for ${SHA} (pending=${pending}); waiting..."
            fi
            sleep 20
          done
          echo "Timed out waiting for green CI on ${SHA}; refusing to publish."
          exit 1

      - uses: actions/checkout@v5

      - name: Download Godot + export templates
        run: |
          set -euo pipefail
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7-stable_linux.x86_64
          curl -sL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          unzip -q templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.stable
          mv templates/* ~/.local/share/godot/export_templates/4.7.stable/

      # The project has one imported resource (the icon), and an export with
      # no import cache ships it as a missing dependency. One pass fills it.
      - name: Import resources
        run: |
          set -euo pipefail
          ./Godot_v4.7-stable_linux.x86_64 --headless --path . --import

      - name: Export the web build
        run: |
          set -euo pipefail
          mkdir -p build/web
          ./Godot_v4.7-stable_linux.x86_64 --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.wasm

      # The downloadable build, which is what the itch app actually serves.
      # Built here rather than locally because the full export template pack
      # is ~1GB and CI already downloads it for the web export.
      - name: Export the Windows build
        run: |
          set -euo pipefail
          mkdir -p build/win
          ./Godot_v4.7-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop" build/win/PathOfLeashResistance.exe
          test -f build/win/PathOfLeashResistance.exe
          ls -la build/win
          # a packed single-file build should be tens of MB, not a stub
          test "$(stat -c%s build/win/PathOfLeashResistance.exe)" -gt 20000000

      # keep producing the zip as well, so there is always a manual
      # fallback and something attached to the GitHub release
      - name: Zip them (manual-upload fallback)
        run: |
          set -euo pipefail
          cd build/web && zip -q -r ../../leash-resistance-web.zip . && cd ../..
          cd build/win && zip -q -r ../../leash-resistance-windows.zip . && cd ../..

      # itch goes FIRST: shipping the playable build is the point, and it
      # must not be blocked by anything cosmetic downstream
      - name: Push to itch.io with butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BUTLER_API_KEY}" ]; then
            echo "BUTLER_API_KEY secret is required for production release."
            echo "Refusing to skip itch upload with a successful exit."
            exit 1
          fi
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          ./butler -V
          # a tag push names the version; a manual run from a branch does not
          VERSION="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            VERSION="manual-${GITHUB_SHA:0:7}"
          fi
          echo "Publishing userversion ${VERSION}"
          ./butler push build/web \
            cyanidesayonara/path-of-leash-resistance:html5 \
            --userversion "${VERSION}"
          # one channel per platform: itch serves html5 in the browser, and
          # the windows channel through the itch app
          ./butler push build/win \
            cyanidesayonara/path-of-leash-resistance:windows \
            --userversion "${VERSION}"

      # nice-to-have, so it never fails the deploy it follows
      - name: Attach the zip to the GitHub release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: |
            leash-resistance-web.zip
            leash-resistance-windows.zip
          generate_release_notes: true
