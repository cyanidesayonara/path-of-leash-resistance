name: Release to itch.io

# Production publish path: push a version tag (v*). Release waits for a
# successful CI run on that exact commit SHA, then exports and publishes.
#
# Manual dispatch exists as an escape hatch, and it is gated the same way by
# default: dispatch on a tag and it still waits for green CI on that SHA. The
# gate is only skipped if the operator explicitly ticks skip_ci_gate, which is
# for when the GATE itself is broken - otherwise a flaky CI run on an
# already-pushed tag would leave no way to publish but deleting the tag.
# Every job here runs on a v* tag only: dispatched from a branch, it skips.
#
# Secrets live in environments, never the repository (docs/release-secrets.md):
# BUTLER_API_KEY in `itch` (the publish job), the Android signing key and the
# Play service account in `google-play` (the android job). Each environment
# deploys from v* tags (and main, for credentials.yml's check) only. Secrets
# reach scripts through env:, never written into a run: script.
# `git tag v1.76 && git push --tags` publishes (once CI is green for the
# tagged SHA). When this workflow finishes, pages.yml puts the tag's web build
# on the website at /play (docs/website.md).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      skip_ci_gate:
        description: "Publish without waiting for green CI (only if the gate itself is broken)"
        type: boolean
        default: false

jobs:
  publish:
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    environment: itch
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # the default token is read-only, so creating a GitHub release 403s
    # without contents:write; actions:read is required to query CI runs
    permissions:
      contents: write
      actions: read
    steps:
      - name: Require green CI for this exact SHA
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_ci_gate }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          echo "Requiring a successful CI workflow run for commit ${SHA}"
          # Tag push starts CI in parallel; poll until that SHA is green.
          # A prior successful CI run on the same SHA (e.g. main push) also
          # satisfies the gate - we only care about the exact commit.
          deadline=$((SECONDS + 2400))
          while (( SECONDS < deadline )); do
            json="$(gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --commit "${SHA}" \
              --workflow ci.yml \
              --limit 30 \
              --json databaseId,conclusion,status,event,url,displayTitle,headSha)"
            echo "${json}" | jq -c '.[] | {databaseId,status,conclusion,event,url}' || true

            success="$(echo "${json}" | jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length')"
            if [ "${success}" -gt 0 ]; then
              echo "CI succeeded for ${SHA}; proceeding with release."
              echo "${json}" | jq '[.[] | select(.status == "completed" and .conclusion == "success")][0]'
              exit 0
            fi

            pending="$(echo "${json}" | jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting" or .status == "requested")] | length')"
            failed="$(echo "${json}" | jq '[.[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "startup_failure")] | length')"

            if [ "${pending}" -eq 0 ] && [ "${failed}" -gt 0 ]; then
              echo "CI did not succeed for ${SHA}; refusing to publish."
              exit 1
            fi

            if [ "$(echo "${json}" | jq 'length')" -eq 0 ]; then
              echo "No CI runs listed yet for ${SHA}; waiting..."
            else
              echo "CI not green yet for ${SHA} (pending=${pending}); waiting..."
            fi
            sleep 20
          done
          echo "Timed out waiting for green CI on ${SHA}; refusing to publish."
          exit 1

      # full history so tools/stamp_version.sh can see the tags
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Godot + export templates
        run: |
          set -euo pipefail
          curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors -o godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7-stable_linux.x86_64
          curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          unzip -q templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.stable
          mv templates/* ~/.local/share/godot/export_templates/4.7.stable/

      # The project has one imported resource (the icon), and an export with
      # no import cache ships it as a missing dependency. One pass fills it.
      - name: Import resources
        run: |
          set -euo pipefail
          ./Godot_v4.7-stable_linux.x86_64 --headless --path . --import

      # the soundtrack rendered once, here, from this commit's audio/music.gd:
      # the exports play these tracks instead of synthesizing them mid-walk
      - name: Bake the soundtrack
        run: |
          set -euo pipefail
          ./Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tools/bake_music.gd
          test "$(ls music/baked/*.res | wc -l)" -gt 40

      # the title's version label: this tag plus the short commit hash
      - name: Stamp the build label
        run: bash tools/stamp_version.sh

      - name: Export the web build
        run: |
          set -euo pipefail
          mkdir -p build/web
          ./Godot_v4.7-stable_linux.x86_64 --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.wasm

      # The downloadable build, which is what the itch app actually serves.
      # Built here rather than locally because the full export template pack
      # is ~1GB and CI already downloads it for the web export.
      - name: Export the Windows build
        run: |
          set -euo pipefail
          mkdir -p build/win
          ./Godot_v4.7-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop" build/win/PathOfLeashResistance.exe
          test -f build/win/PathOfLeashResistance.exe
          ls -la build/win
          # a packed single-file build should be tens of MB, not a stub
          test "$(stat -c%s build/win/PathOfLeashResistance.exe)" -gt 20000000

      # handed to the msix job below, which needs a Windows runner
      - name: Keep the Windows build for the MSIX job
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/win/PathOfLeashResistance.exe
          retention-days: 7

      # keep producing the zip as well, so there is always a manual
      # fallback and something attached to the GitHub release
      - name: Zip them (manual-upload fallback)
        run: |
          set -euo pipefail
          cd build/web && zip -q -r ../../leash-resistance-web.zip . && cd ../..
          cd build/win && zip -q -r ../../leash-resistance-windows.zip . && cd ../..

      # itch goes FIRST: shipping the playable build is the point, and it
      # must not be blocked by anything cosmetic downstream
      - name: Push to itch.io with butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BUTLER_API_KEY}" ]; then
            echo "BUTLER_API_KEY (itch environment) is required for production release."
            echo "Refusing to skip itch upload with a successful exit."
            exit 1
          fi
          curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          ./butler -V
          # the job runs on a v* tag only, so the tag names the version
          VERSION="${GITHUB_REF_NAME}"
          echo "Publishing userversion ${VERSION}"
          ./butler push build/web \
            cyanidesayonara/path-of-leash-resistance:html5 \
            --userversion "${VERSION}"
          # one channel per platform: itch serves html5 in the browser, and
          # the windows channel through the itch app
          ./butler push build/win \
            cyanidesayonara/path-of-leash-resistance:windows \
            --userversion "${VERSION}"

      # nice-to-have, so it never fails the deploy it follows. The website's
      # /play is built from this web zip: pages.yml runs when this workflow
      # finishes and publishes the tag's zip (or the latest release's, if
      # this step failed), so the site's own part and /play deploy together.
      - name: Attach the zip to the GitHub release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: |
            leash-resistance-web.zip
            leash-resistance-windows.zip
          generate_release_notes: true

  # The Microsoft Store package: packs the exe exported above into an unsigned
  # MSIX, installs and launches it once to prove it runs packaged, runs WACK,
  # and attaches it to the GitHub release for upload in Partner Center. A separate job after
  # publish, so a Store packaging failure can never hold back itch.
  msix:
    needs: publish
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: build/win

      - name: Pack
        run: ./tools/pack_msix.ps1 -Exe build/win/PathOfLeashResistance.exe -Tag $env:GITHUB_REF_NAME

      - name: Install and launch it packaged
        run: ./tools/verify_msix.ps1 -Msix (Get-ChildItem build/msix/*.msix).FullName

      - name: Windows App Certification Kit
        run: ./tools/wack_msix.ps1 -Msix (Get-ChildItem build/msix/*.msix).FullName

      - name: Attach the MSIX to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:GITHUB_REF_NAME (Get-ChildItem build/msix/*.msix).FullName --repo $env:GITHUB_REPOSITORY --clobber

  # Android AAB + APK build for Google Play Closed Testing / GitHub release.
  # Runs only on version tags when ANDROID_KEYSTORE_BASE64 is configured in
  # the google-play environment; skips gracefully until it is.
  android:
    needs: publish
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    environment: google-play
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check signing secrets
        id: check
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret not set; skipping Android export and Play upload."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}" ]; then
            echo "play=false" >> "$GITHUB_OUTPUT"
          else
            echo "play=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.enabled == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: "17"

      # the runner has an SDK already; the action's default packages
      # include "tools", which the SDK no longer has
      - uses: android-actions/setup-android@v3
        if: steps.check.outputs.enabled == 'true'
        with:
          packages: platform-tools

      - name: Install Android SDK components
        if: steps.check.outputs.enabled == 'true'
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Download Godot + export templates
        if: steps.check.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors -o godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7-stable_linux.x86_64
          curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          unzip -q templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.stable
          mv templates/* ~/.local/share/godot/export_templates/4.7.stable/

      - name: Import, bake music, stamp version
        if: steps.check.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          ./Godot_v4.7-stable_linux.x86_64 --headless --path . --import
          ./Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tools/bake_music.gd
          bash tools/stamp_version.sh

      # tools/android_export.sh is the same export android.yml proves on
      # every pull request that touches it, there with a throwaway key
      - name: Export signed AAB and sideload APK
        if: steps.check.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.keystore"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          GODOT="$PWD/Godot_v4.7-stable_linux.x86_64" bash tools/android_export.sh

      - name: Attach Android bundles to GitHub release
        if: steps.check.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" build/android/PathOfLeashResistance.aab build/android/PathOfLeashResistance.apk --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload AAB to Google Play internal track
        if: steps.check.outputs.enabled == 'true' && steps.check.outputs.play == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.santtunykanen.pathofleashresistance
          releaseFiles: build/android/PathOfLeashResistance.aab
          track: internal
          status: completed
